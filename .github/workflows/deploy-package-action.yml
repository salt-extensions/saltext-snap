# Publishes the built packages to Test PyPI and PyPI.
#
# This workflow is registered as the PyPI Trusted Publisher, meaning any job
# in this file with `id-token: write` can mint valid PyPI publish tokens.
# Keep it minimal: artifact verification and publishing only.
# Subsequent release steps run in finalize-release-action.yml.
---
name: Release Salt Extension Python Package

on:
  # zizmor: ignore[dangerous-triggers]
  # `workflow_run` selects triggering runs by display name only, which a pull
  # request can claim by adding a `pull_request`-triggered workflow of the same
  # name. The trigger alone therefore grants no trust - `get_version` below
  # verifies the triggering run's provenance before anything is touched.
  workflow_run:
    types:
      - completed
    # Note: Cannot restrict by branch, valid triggers include tag events
    workflows:
      # Without a push secret, merging the autorelease PR cannot cause
      # a tag push event, so `Auto PR Releases` runs the release pipeline itself.
      - Auto PR Releases
      - Tagged Releases

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
  queue: max

cache-mode: none
permissions: {}

jobs:
  get_version:
    name: Get package version
    runs-on: ubuntu-26.04
    # Only accept runs of the expected release workflows, identified by their
    # file path and trigger, never by name alone. The `event` check carries the
    # weight: a pull request can rewrite a workflow's trigger to `pull_request`
    # and run its own definition, but it can neither execute its own definition
    # under `pull_request_target` (that always runs the default branch's version)
    # nor cause a tag `push` event without write access.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (
        (
          github.event.workflow_run.event == 'pull_request_target' &&
          github.event.workflow_run.path == '.github/workflows/tag-auto.yml'
        ) ||
        (
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.path == '.github/workflows/tag.yml'
        )
      )
    permissions:
      actions: read  # Downloading release artifact from other workflow run
    outputs:
      version: ${{ steps.extract-version.outputs.version }}

    steps:

      - name: Download expected version
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: version.txt
          path: ${{ runner.temp }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download Python Package Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: salt-extension-packages
          path: ${{ runner.temp }}/dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Extract and verify package version
        id: extract-version
        run: |-
          wheel_file="$(find "$RUNNER_TEMP/dist" -name '*.whl' | head -n 1)"
          test -n "$wheel_file" || exit 1
          unzip "$wheel_file" -d "$RUNNER_TEMP/extract"
          dist_info="$(find "$RUNNER_TEMP/extract" -type d -name '*.dist-info' | head -n 1)"
          test -n "$dist_info" || exit 1
          package_version="$(sed -n 's/^Version:\s*\(\S*\)$/\1/p' "$dist_info/METADATA")"
          test -n "$package_version" || exit 1
          expected_version="$(cat "$RUNNER_TEMP/version.txt" | head -n 1)"
          echo "Detected package version: $package_version"
          echo "Expected version: $expected_version"
          test "$package_version" = "$expected_version" || exit 1
          echo "version=$expected_version" >> "$GITHUB_OUTPUT"

      - name: Write release metadata
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |-
          mkdir "$RUNNER_TEMP/release-meta"
          cp "$RUNNER_TEMP/version.txt" "$RUNNER_TEMP/release-meta/version.txt"
          echo -n "$SOURCE_RUN_ID" > "$RUNNER_TEMP/release-meta/source-run-id.txt"

      - name: Upload release metadata
        # Consumed by finalize-release-action.yml, which handles the
        # remaining release steps after the packages were published.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-meta
          path: ${{ runner.temp }}/release-meta

      - name: Upload verified packages
        # The publish jobs download the packages from this run again,
        # ensuring they publish the exact bytes that were verified above.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: salt-extension-packages
          path: ${{ runner.temp }}/dist

  test_release:
    name: Publish Python Package to Test PyPI
    runs-on: ubuntu-26.04
    needs:
      - get_version
    permissions:
      id-token: write  # Trusted Publishing

    steps:
      - name: Download verified packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: salt-extension-packages
          path: dist

      - name: Publish distribution to Test PyPI
        # zizmor: ignore[use-trusted-publishing] Trusted Publishing is used when TEST_PYPI_API_TOKEN is unset
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          attestations: ${{ secrets.TEST_PYPI_API_TOKEN == '' }}
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
          verbose: ${{ runner.debug == '1' }}

  pypi_release:
    name: Publish Python Package to PyPI
    runs-on: ubuntu-26.04
    needs:
      - test_release
    permissions:
      id-token: write  # Trusted Publishing
    environment:
      name: release
      url: https://pypi.org/p/saltext.snap

    steps:
      - name: Download verified packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: salt-extension-packages
          path: dist

      - name: Publish distribution to PyPI
        # zizmor: ignore[use-trusted-publishing] Trusted Publishing is used when PYPI_API_TOKEN is unset
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          attestations: ${{ secrets.PYPI_API_TOKEN == '' }}
          password: ${{ secrets.PYPI_API_TOKEN }}
          verbose: ${{ runner.debug == '1' }}

  # The GitHub release and the docs deployment run separately on
  # `workflow_run` in finalize-release-action.yml.
