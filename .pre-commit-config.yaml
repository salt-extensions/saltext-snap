---
minimum_pre_commit_version: 3.0.0
default_language_version:
  # Flooring the Python version works for pre-commit on non-Windows machines and prek everywhere.
  # Since we install prek on Windows by default, ignore the issue pre-commit has there (it embeds
  # the raw interpreter spec in the venv path and `>` is invalid in Windows paths)
  python: ">= 3.11"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: check-merge-conflict   # Check for files that contain merge conflict strings.
        args: [--assume-in-merge]
      - id: trailing-whitespace    # Trim trailing whitespace.
        args: [--markdown-linebreak-ext=md]
      - id: mixed-line-ending      # Ensure files use UNIX-style newlines only.
        args: [--fix=lf]
      - id: end-of-file-fixer      # Ensure files end with a newline.
      - id: check-ast              # Check whether files parse as valid Python.

  # ----- Formatting ---------------------------------------------------------------------------->
  - repo: https://github.com/saltstack/pre-commit-remove-import-headers
    rev: e79f595c0df31b8cb152c53993ce7c3c64f07cd4  # 1.1.0
    hooks:
      - id: remove-import-headers

  - repo: local
    hooks:
      - id: check-cli-examples
        name: Check CLI examples on execution modules
        entry: python .pre-commit-hooks/check-cli-examples.py
        language: python
        files: ^src/saltext/snap/(resources/[^/]+/)?modules/.*\.py$

  - repo: local
    hooks:
      - id: check-docs
        name: Check rST doc files exist for modules/states
        entry: python .pre-commit-hooks/make-autodocs.py
        language: python
        pass_filenames: false

  - repo: https://github.com/hukkin/mdformat
    rev: 2d496dbc18e31b83a1596685347ffe0b6041daf0  # 1.0.0
    hooks:
    - id: mdformat
      name: Autoformat MyST/Markdown
      files: ^(?!(\.github/|changelog/|CHANGELOG\.md)).*\.md$
      additional_dependencies:
      - mdformat-config
      - git+https://github.com/salt-extensions/mdformat-myst.git@32e083a2d5a22ae605ebaf1176f0bcdc789fb138
      - mdformat-pyproject

  - repo: https://github.com/saltstack/salt-rewrite
    # Automatically rewrite code with known rules
    rev: 2401c0faef69b6b846c719d611bcfe358234d5d1  # 2.5.2
    hooks:
      - id: salt-rewrite
        alias: rewrite-docstrings
        name: Salt extensions docstrings auto-fixes
        files: ^src/saltext/snap/.*\.py$
        args: [--silent, -E, fix_tornado_imports]

  - repo: https://github.com/saltstack/salt-rewrite
    # Automatically rewrite code with known rules
    rev: 2401c0faef69b6b846c719d611bcfe358234d5d1  # 2.5.2
    hooks:
      - id: salt-rewrite
        alias: rewrite-tests
        name: Rewrite the test suite
        files: ^tests/.*\.py$
        args: [--silent, -E, fix_docstrings, -E, fix_tornado_imports]

  - repo: https://github.com/asottile/pyupgrade
    rev: f22ea0651f4355c655cc581f67813c991c74a312  # v3.22.0
    hooks:
      - id: pyupgrade
        name: Rewrite Code to be Py3.11+
        args: [
          --py311-plus,
        ]
        exclude: src/saltext/snap/version.py

  - repo: https://github.com/PyCQA/isort
    rev: 9f905615631c545f5aea2516508109350d1d2f7d  # 9.0.2
    hooks:
      - id: isort
        args: [
          --py=311,
        ]
        exclude: src/saltext/snap/(__init__|version).py

  - repo: https://github.com/psf/black
    rev: 258e7dbf348bc23cb70b8cdf693481c04634ebcc  # 26.10.1
    hooks:
      - id: black
        args: [-l 100]
        exclude: src/saltext/snap/version.py

  - repo: https://github.com/adamchainz/blacken-docs
    rev: fda77690955e9b63c6687d8806bafd56a526e45f  # 1.20.0
    hooks:
      - id: blacken-docs
        args: [--skip-errors]
        files: ^(docs/.*\.(md|rst)|src/saltext/snap/.*\.py)$
        additional_dependencies:
          - black==26.10.1
  # <---- Formatting -----------------------------------------------------------------------------

  # ----- Security ------------------------------------------------------------------------------>
  - repo: https://github.com/PyCQA/bandit
    rev: 92ae8b82fb422a639f0ed8d99e96cea769594e08  # 1.9.4
    hooks:
      - id: bandit
        alias: bandit-salt
        name: Run bandit against the code base
        args: [--silent, -lll, --skip, B701]
        exclude: src/saltext/snap/version.py

  - repo: https://github.com/PyCQA/bandit
    rev: 92ae8b82fb422a639f0ed8d99e96cea769594e08  # 1.9.4
    hooks:
      - id: bandit
        alias: bandit-tests
        name: Run bandit against the test suite
        args: [--silent, -lll, --skip, B701]
        files: ^tests/.*
  # <---- Security -------------------------------------------------------------------------------

  # ----- Code Analysis ------------------------------------------------------------------------->

  - repo: local
    hooks:
      - id: nox
        alias: lint-src
        name: Lint Source Code
        language: python
        entry: nox -e lint-code --
        files: ^((setup|noxfile)|src/.*)\.py$
        require_serial: true
        additional_dependencies:
          - nox==2026.10.20
          # Speeds up this hook significantly and, since prek-created hook envs
          # don't include pip, provides the uv install path nox needs there.
          # uv only ships wheels for these platforms; elsewhere (e.g. FreeBSD),
          # the hooks run via pre-commit, whose envs include pip.
          - uv==0.13.5 ; sys_platform == 'linux' or sys_platform == 'darwin' or sys_platform == 'win32'

      - id: nox
        alias: lint-tests
        name: Lint Tests
        language: python
        entry: nox -e lint-tests --
        files: ^tests/.*\.py$
        require_serial: true
        additional_dependencies:
          - nox==2026.10.20
          - uv==0.13.5 ; sys_platform == 'linux' or sys_platform == 'darwin' or sys_platform == 'win32'

      - id: zizmor
        name: Check actions and workflows
        description: Find security issues in GitHub Actions CI/CD setups
        language: python
        types: [yaml]
        files: (^|/)(\.github/(workflows/[^/]+|dependabot)\.ya?ml|action\.ya?ml|\.pre-commit-(config|hooks)\.ya?ml)$
        require_serial: true
        # We don't want to fail if zizmor cannot be installed locally for some reason,
        # e.g. no pre-built wheels and no build toolchain. We DO want to fail in CI though.
        # This custom hook implements the autoskip behavior while still providing autoinstall on supported platforms.
        # Otherwise, the definitions are taken from https://github.com/zizmorcore/zizmor-pre-commit.
        entry: >-
          python -c 'import os, shutil, sys;
          zizmor = shutil.which("zizmor");
          sys.exit("zizmor not found") if not zizmor and os.getenv("CI") else None;
          print("SKIPPED: zizmor is not installed", file=sys.stderr) if not zizmor else None;
          os.execv(zizmor, [zizmor, "--no-progress", "-p", "--fix", *sys.argv[1:]]) if zizmor else None'
        verbose: true
        additional_dependencies:
          # renovate:
          - zizmor==1.31.1 ; sys_platform == 'linux' or sys_platform == 'darwin' or sys_platform == 'win32'

  - repo: https://github.com/kjanat/actionlint
    rev: 08bb2c4f0d039744455b87aef1c647fb8b66d37b  # v1.17.0
    hooks:
      - id: actionlint-shellcheck
        alias: actionlint
  # <---- Code Analysis --------------------------------------------------------------------------
